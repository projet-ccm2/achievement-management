name: Deploy to Integration
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Docker image tag to deploy (default: int-{sha})"
        required: false
        type: string
        default: ""
      run-tests:
        description: "Run integration tests after deployment"
        required: false
        type: boolean
        default: true

jobs:
  deploy-int:
    name: Deploy to Integration
    uses: projet-ccm2/shared-workflows/.github/workflows/nodejs-cd.yml@main
    if: github.event_name != 'pull_request'
    with:
      docker-image-name: achievement-management-api-int
      docker-tag: ${{ github.event.inputs.image-tag || format('dev-{0}', github.sha) }}
      artifact-registry-repository: "achievement-management-docker-int"
      environment: integration
      cloud-run-service-name: achievement-management-int
      service_type: "bff"
      required_env_vars: "DB_SERVICE_URL,IA_SERVICE_URL,BUCKET_MANAGER_URL,NOTIFICATION_HANDLER_URL,ALLOWED_ORIGINS,FRONT_URL,TWITCH_EXTENSION_IDS"
    secrets:
      GCP_SA_KEY: ${{ secrets.INT_GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.INT_GCP_PROJECT_ID }}
      DB_SERVICE_URL: ${{ secrets.INT_DB_SERVICE_URL }}
      IA_SERVICE_URL: ${{ secrets.INT_IA_SERVICE_URL }}
      BUCKET_MANAGER_URL: ${{ secrets.INT_BUCKET_MANAGER_URL }}
      NOTIFICATION_HANDLER_URL: ${{ secrets.INT_NOTIFICATION_HANDLER_URL }}
      ALLOWED_ORIGINS: ${{ secrets.INT_ALLOWED_ORIGINS }}
      FRONT_URL: ${{ secrets.INT_FRONT_URL }}
      TWITCH_EXTENSION_IDS: ${{ secrets.INT_TWITCH_EXTENSION_IDS }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
